name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Preparar llave de firma (si existe en los secretos)
        env:
          KEYSTORE_B64: ${{ secrets.KURA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kura.jks"
            echo "KURA_KEYSTORE_PATH=$RUNNER_TEMP/kura.jks" >> "$GITHUB_ENV"
          fi

      - name: Compilar
        env:
          KURA_KEYSTORE_PASSWORD: ${{ secrets.KURA_KEYSTORE_PASSWORD }}
          KURA_KEY_ALIAS: ${{ secrets.KURA_KEY_ALIAS }}
          KURA_KEY_PASSWORD: ${{ secrets.KURA_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Nombrar APK
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/release/app-release.apk "salida/Kura-0.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Kura-0.1.${{ github.run_number }}
          path: salida/*.apk

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Kura 0.1.${{ github.run_number }}
          files: salida/*.apk
          body: APK compilada automáticamente desde ${{ github.sha }}
